<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Tools Platform</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <!-- Three.js for GD&T (local r128 copies) -->
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand" onclick="window.location.hash='#home'">
            <i class="fa-solid fa-layer-group"></i> 
            <span>Tohoho-kun Tech Platform</span>
        </div>
        <div class="nav-controls">
            <select id="lang-select" class="custom-select" style="margin-right: 15px; background: transparent; border: 1px solid var(--panel-border);">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <main id="app-content">
        <!-- Views will be injected here by app.js -->
    </main>

    <!-- Templates -->
    <template id="view-home">
        <div class="container fade-in">
            <header class="page-header">
                <h1 data-i18n="portal_title">エンジニアリング ツールポータル</h1>
                <p data-i18n="portal_desc">現場で使える直感的な技術計算シミュレーター</p>
            </header>
            
            <div class="app-grid">
                <!-- App Card -->
                <div class="app-card" onclick="window.location.hash='#cpk'">
                    <div class="app-card-icon">
                        <i class="fa-solid fa-chart-bell-curve"></i>
                    </div>
                    <div class="app-card-content">
                        <h3 data-i18n="cpk_app_title">プロセス・キャパビリティ (Cpk) シミュレーター</h3>
                        <p data-i18n="cpk_app_desc">工程能力の直感的な理解とデータの実力値を理論値と重ねて分析・比較できるツール。</p>
                    </div>
                </div>

                    <div class="app-card" onclick="window.location.hash='#grr'">
                        <div class="app-card-icon">
                            <i class="fa-solid fa-microscope"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="grr_app_title">ゲージR&R アナライザー</h3>
                            <p data-i18n="grr_app_desc">測定器の分解能や繰り返し性・再現性が工程能力に与える影響を解析するツール。</p>
                        </div>
                    </div>

                    <!-- App Card -->
                    <div class="app-card" onclick="window.location.hash='#gdt-position'">
                        <div class="app-card-icon">
                            <i class="fa-solid fa-cube"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="gdt_title">GD&T 位置度シミュレーター</h3>
                            <p data-i18n="gdt_app_desc">3D空間と2D平面で位置度（Position）的概念を視覚化し、±公差との違いを学ぶ教育ツール。</p>
                        </div>
                    </div>

                    <!-- App Card -->
                    <div class="app-card" onclick="window.location.hash='#symbol-combiner'">
                        <div class="app-card-icon">
                            <i class="fa-solid fa-icons"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="symbol_app_title">記号・アイコン コンバイナー</h3>
                            <p data-i18n="symbol_app_desc">記号と文字を組み合わせて、オリジナルのアイコンを簡単に作成・コピーできるツール。</p>
                        </div>
                    </div>

                    <!-- App Card: Weld-Blade -->
                    <div class="app-card" onclick="window.location.hash='#weld'">
                        <div class="app-card-icon">
                            <i class="fa-solid fa-scissors"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="weld_app_title">Macro measurement of weld cross section</h3>
                            <p data-i18n="weld_app_desc">4K画像対応。爆速ですみ肉溶接の脚長・のど厚を計測・保存できるツール。</p>
                        </div>
                    </div>
                    <!-- App Card: Torque Converter -->
                    <div class="app-card" onclick="window.location.hash='#torque'">
                        <div class="app-card-icon" style="background: linear-gradient(135deg, #f59e0b, #ef4444); color: #ffffff;">
                            <i class="fa-solid fa-wrench"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="torque_app_title">トルク単位変換 (N·m ⇄ lb·ft)</h3>
                            <p data-i18n="torque_app_desc">N·m と lb·ft を双方向で瞬時に高精度変換。デフォルト30N·m・ワンタッチ向き入替・実用プリセット付き。</p>
                        </div>
                    </div>
                    <!-- App Card: Image Compression Compare -->
                    <div class="app-card" onclick="window.open('image-compression-compare.html', '_blank')">
                        <div class="app-card-icon">
                            <i class="fa-solid fa-images"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="imgcmp_app_title">圧縮フォーマット比較ツール</h3>
                            <p data-i18n="imgcmp_app_desc">WebP / AVIF / JPEG / PNG などの画質・ファイルサイズを並べて比較。PSNR・RMSE・差分マップで客観評価。</p>
                            <span style="font-size:0.7rem; color: var(--text-secondary); margin-top:4px; display:block;">↗ 別タブで開く</span>
                        </div>
                    </div>
                    <!-- App Card: Gemini Bilingual Translator -->
                    <div class="app-card" onclick="window.open('bilingual-translator.html', '_blank')">
                        <div class="app-card-icon" style="background: linear-gradient(135deg, #7c3aed, #d946ef);">
                            <i class="fa-solid fa-language text-white"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="translator_app_title">Gemini Live Bilingual Translator</h3>
                            <p data-i18n="translator_app_desc">超低遅延リアルタイム日英双方向音声翻訳 ＆ AI要約・アシスタント統合スタジオ。</p>
                            <span style="font-size:0.7rem; color: var(--text-secondary); margin-top:4px; display:block;">↗ 別タブで開く</span>
                        </div>
                    </div>
                    <!-- App Card: Gemini 3.5 Transcribe & Translate Studio -->
                    <div class="app-card" onclick="window.open('35transcribe.html', '_blank')">
                        <div class="app-card-icon" style="background: linear-gradient(135deg, #6366f1, #a855f7);">
                            <i class="fa-solid fa-microphone-lines text-white"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="transcribe_app_title">Gemini 3.5 文字起こし・翻訳 & 話者分離</h3>
                            <p data-i18n="transcribe_app_desc">Gemini 3.5 Transcribe Live による低遅延リアルタイム文字起こし＆文脈考慮Flash-Lite翻訳。録音後は話者分離＆3.8 Flash議事録要約。</p>
                            <div class="card-link-row">
                                <span style="color: var(--text-secondary);">↗ 別タブで開く</span>
                                <a href="https://github.com/Tohoho-kun/35transcribe" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="card-gh-link">
                                    <i class="fa-brands fa-github"></i> GitHub
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-- App Card: OKLab Tone Curve & Photo Retouch -->
                    <div class="app-card" onclick="window.open('https://oklab-tone-editor.pages.dev', '_blank')">
                        <div class="app-card-icon" style="background: linear-gradient(135deg, #0ea5e9, #6366f1);">
                            <i class="fa-solid fa-bezier-curve text-white"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="oklab_app_title">OKLab Tone Curve & Photo Retouch</h3>
                            <p data-i18n="oklab_app_desc">知覚的色空間（OKLab / OKLch / Okhsl）による高精度トーンカーブ調整＆フォトレタッチツール。完全クライアントサイド動作。</p>
                            <div class="card-link-row">
                                <span style="color: var(--text-secondary);">↗ 別タブで開く</span>
                                <a href="https://github.com/Tohoho-kun/oklab-tone-curve-editor" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="card-gh-link">
                                    <i class="fa-brands fa-github"></i> GitHub
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-- App Card: Category Theory Organizational Model -->
                    <div class="app-card" onclick="window.open('organizational-category-theory.html', '_blank')">
                        <div class="app-card-icon" style="background: linear-gradient(135deg, #2563eb, #7c3aed);">
                            <i class="fa-solid fa-diagram-project text-white"></i>
                        </div>
                        <div class="app-card-content">
                            <h3 data-i18n="org_cat_app_title">組織病理の圏論数理シミュレータ</h3>
                            <p data-i18n="org_cat_app_desc">立場主義閉鎖系と動的適応圏の対比、随伴・モナド・余極限・引き戻しによる組織認知と意思決定の数理モデル。</p>
                            <span style="font-size:0.7rem; color: var(--text-secondary); margin-top:4px; display:block;">↗ 別タブで開く</span>
                        </div>
                    </div>

                </div>
            </div>
    </template>

    <template id="view-cpk">
        <div class="container x-large fade-in">
            <div class="page-header flex-header">
                <div>
                    <button class="back-link" onclick="window.location.hash='#home'"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="back_home">ホームへ戻る</span></button>
                    <div class="title-with-badge">
                        <h1 data-i18n="cpk_title">プロセス・キャパビリティ (Cpk) シミュレーター</h1>
                        <span class="edu-badge"><i class="fa-solid fa-graduation-cap"></i> <span data-i18n="edu_notice">技術教育・工程能力シミュレーター</span></span>
                    </div>
                </div>
            </div>

            <div class="layout-grid cpk-layout">
                <!-- Left Sidebar: Controls -->
                <aside class="control-panel panel">
                    <!-- Presets -->
                    <div class="control-group">
                        <label class="group-label"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="cpk_preset_label">学習プリセット</span></label>
                        <div class="preset-btn-grid">
                            <button type="button" class="btn small preset-btn" data-cpk-preset="capable">
                                <strong>安定工程</strong>
                                <small>Cpk 1.33</small>
                            </button>
                            <button type="button" class="btn small preset-btn" data-cpk-preset="shifted">
                                <strong>中心ズレ</strong>
                                <small>Cpk 0.83</small>
                            </button>
                            <button type="button" class="btn small preset-btn" data-cpk-preset="variation">
                                <strong>ばらつき過大</strong>
                                <small>Cp 0.75</small>
                            </button>
                            <button type="button" class="btn small preset-btn" data-cpk-preset="coarse">
                                <strong>粗い分解能</strong>
                                <small>量子化影響</small>
                            </button>
                        </div>
                    </div>

                    <hr>

                    <h2><i class="fa-solid fa-sliders"></i> <span data-i18n="cpk_spec_settings">規格 ＆ 理論分布</span></h2>
                    
                    <div class="control-group-grid2">
                        <div class="control-group">
                            <label for="input-usl" data-i18n="usl_label">規格上限 (USL)</label>
                            <input type="number" id="input-usl" value="1.00" step="0.01">
                        </div>
                        <div class="control-group">
                            <label for="input-lsl" data-i18n="lsl_label">規格下限 (LSL)</label>
                            <input type="number" id="input-lsl" value="-1.00" step="0.01">
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="slider-header">
                            <label for="input-mean" data-i18n="mean_label">理論平均 (μ)</label>
                            <input type="number" id="val-mean" class="input-sync" value="0.000" step="0.01">
                        </div>
                        <input type="range" id="input-mean" min="-3" max="3" value="0.0" step="0.001">
                    </div>

                    <div class="control-group">
                        <div class="slider-header">
                            <label for="input-std" data-i18n="std_label">理論標準偏差 (σ)</label>
                            <input type="number" id="val-std" class="input-sync" value="0.250" step="0.01" min="0.001">
                        </div>
                        <input type="range" id="input-std" min="0.01" max="2" value="0.250" step="0.001">
                    </div>

                    <hr>
                    
                    <h3><i class="fa-solid fa-dice"></i> <span data-i18n="gen_settings">シミュレーション生成</span></h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px;">
                        <div class="control-group" style="margin-bottom:0;">
                            <label for="input-n" style="font-size:0.75rem;" data-i18n="gen_n">N数 (≤50)</label>
                            <input type="number" id="input-n" value="30" min="5" max="50">
                        </div>
                        <div class="control-group" style="margin-bottom:0;">
                            <label for="input-digits" style="font-size:0.75rem;" data-i18n="gen_decimals">小数桁数</label>
                            <input type="number" id="input-digits" value="2" min="0" max="6">
                        </div>
                        <div class="control-group" style="margin-bottom:0;">
                            <label for="input-step" style="font-size:0.75rem;" data-i18n="gen_step">丸め刻み</label>
                            <input type="number" id="input-step" value="0.01" step="0.001" min="0">
                        </div>
                    </div>
                    <button id="btn-generate" class="btn primary full-width"><i class="fa-solid fa-bolt"></i> <span data-i18n="btn_gen">ランダム生成</span></button>
                    <button id="btn-apply-actual" class="btn secondary full-width mt-2"><i class="fa-solid fa-arrows-to-dot"></i> <span data-i18n="btn_apply">実力値をスライダーに反映</span></button>
                    <button id="btn-toggle-data-drawer" class="btn secondary full-width mt-2"><i class="fa-solid fa-table"></i> <span data-i18n="btn_open_data">実測データ表を開く</span> (<span id="cpk-data-count">30</span>)</button>
                </aside>

                <!-- Right: Visualization & Data -->
                <div class="main-content">
                    
                    <!-- Verdict & Stats area -->
                    <div id="cpk-verdict-banner" class="verdict-banner capable">
                        <div class="verdict-icon"><i class="fa-solid fa-circle-check"></i></div>
                        <div class="verdict-body">
                            <div class="verdict-title" id="cpk-verdict-title">工程能力は十分です (Cpk ≥ 1.33)</div>
                            <div class="verdict-desc" id="cpk-verdict-desc">理論上の不良率は極めて低く、安定した量産が可能な水準です。</div>
                        </div>
                    </div>

                    <div class="stats-grid cpk-stats-grid">
                        <div class="stat-card theoretical">
                            <div class="stat-title" data-i18n="theo_cpk">理論 Cpk</div>
                            <div class="stat-value" id="stat-theory-cpk">--</div>
                            <div class="stat-sub">Cp: <span id="stat-theory-cp">--</span> | 不良率: <span id="stat-theory-ppm">--</span> ppm</div>
                        </div>
                        <div class="stat-card actual">
                            <div class="stat-title" data-i18n="act_cpk">実力 Cpk</div>
                            <div class="stat-value" id="stat-actual-cpk">--</div>
                            <div class="stat-sub">Cp: <span id="stat-actual-cp">--</span> | 不良率: <span id="stat-actual-ppm">--</span> ppm</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-title" data-i18n="act_mean">実力平均 (x̄)</div>
                            <div class="stat-value" id="stat-actual-mean">--</div>
                            <div class="stat-sub">偏り (k): <span id="stat-actual-shift">--</span></div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-title" data-i18n="act_std">実力標準偏差 (s)</div>
                            <div class="stat-value" id="stat-actual-std">--</div>
                            <div class="stat-sub">6s 幅: <span id="stat-actual-6s">--</span></div>
                        </div>
                    </div>

                    <!-- Chart Panel -->
                    <div class="chart-container panel cpk-chart-panel">
                        <div class="chart-controls flex-between">
                            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                                <div class="chart-control-item">
                                    <label for="plot-type-select"><i class="fa-solid fa-chart-line"></i> <span data-i18n="plot_type">実績プロット:</span></label>
                                    <select id="plot-type-select" class="custom-select">
                                        <option value="scatter" data-i18n="plot_scatter">散布図 (Beeswarm)</option>
                                        <option value="line" data-i18n="plot_curve">正規曲線 (Curve)</option>
                                        <option value="histogram" data-i18n="plot_hist">ヒストグラム (Histogram)</option>
                                    </select>
                                </div>
                                <label class="checkbox-label" style="font-size:0.85rem; cursor:pointer;">
                                    <input type="checkbox" id="cpk-show-shading" checked>
                                    <span data-i18n="cpk_show_shading">規格外テール強調</span>
                                </label>
                                <label class="checkbox-label" style="font-size:0.85rem; cursor:pointer;">
                                    <input type="checkbox" id="cpk-show-target" checked>
                                    <span data-i18n="cpk_show_target">規格中心 ＆ 偏り矢印</span>
                                </label>
                            </div>
                        </div>
                        <div class="cpk-canvas-wrapper" style="position:relative; width:100%; height:340px;">
                            <canvas id="cpk-chart"></canvas>
                        </div>
                    </div>

                    <!-- Collapsible Data Drawer -->
                    <div id="cpk-data-drawer" class="panel mt-3 cpk-data-drawer" style="display:none;">
                        <div class="flex-header compact-header" style="margin-bottom:10px;">
                            <h3><i class="fa-solid fa-table"></i> <span data-i18n="data_label">実測データ一覧 (N=50)</span></h3>
                            <div class="table-actions" style="display:flex; gap:6px;">
                                <button id="btn-paste-data" class="btn small secondary" title="Excelから列データを貼り付け"><i class="fa-solid fa-paste"></i> <span data-i18n="btn_paste">Excel貼付</span></button>
                                <button id="btn-copy" class="btn small secondary" title="Excelコピー"><i class="fa-regular fa-copy"></i> <span data-i18n="btn_copy">コピー</span></button>
                                <button id="btn-clear" class="btn small secondary" title="クリア"><i class="fa-solid fa-eraser"></i> <span data-i18n="btn_clear">クリア</span></button>
                                <button id="btn-close-data-drawer" class="icon-btn small-icon" title="閉じる"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>
                        <div class="table-container tight" style="max-height:220px; overflow-y:auto;">
                            <table class="data-table excel-style" id="data-table">
                                <thead>
                                    <tr>
                                        <th>No.</th>
                                        <th data-i18n="data_val_label">測定値 (Value)</th>
                                        <th>判定</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Rows injected by cpk.js -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </template>
    <template id="view-grr">
        <div class="container x-large fade-in">
            <div class="page-header flex-header">
                <div>
                    <button class="back-link" onclick="window.location.hash='#home'"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="back_home">ホームへ戻る</span></button>
                    <div class="title-with-badge">
                        <h1 data-i18n="grr_title">ゲージR&R アナライザー (MSA)</h1>
                        <span class="edu-badge"><i class="fa-solid fa-graduation-cap"></i> <span data-i18n="edu_notice">測定システム解析・ANOVA法</span></span>
                    </div>
                </div>
            </div>

            <div class="layout-grid grr-layout">
                <!-- Left: Controls -->
                <aside class="control-panel panel">
                    <!-- Presets -->
                    <div class="control-group">
                        <label class="group-label"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="grr_presets_title">学習プリセット</span></label>
                        <div class="preset-btn-grid">
                            <button type="button" class="btn small preset-btn" data-grr-preset="ideal">
                                <strong>理想的</strong>
                                <small>%GRR &lt; 10%</small>
                            </button>
                            <button type="button" class="btn small preset-btn" data-grr-preset="operator_bias">
                                <strong>作業者差大</strong>
                                <small>再現性不良</small>
                            </button>
                            <button type="button" class="btn small preset-btn" data-grr-preset="gauge_error">
                                <strong>ゲージ誤差大</strong>
                                <small>繰返し性不良</small>
                            </button>
                            <button type="button" class="btn small preset-btn" data-grr-preset="coarse_res">
                                <strong>分解能粗い</strong>
                                <small>量子化ボトルネック</small>
                            </button>
                        </div>
                    </div>

                    <hr>
