<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>組織認知の圏論マップ</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f5f6f8; --surface:rgba(255,255,255,.72); --surface-solid:#ffffff;
  --line:#dde1e8; --edge:#b9c0cc; --text:#1c2230; --muted:#687083; --faint:#a2a9b6;
  --node:#ffffff; --accent:#5468e8;
  --cog:#6b8fd6; --pos:#b39a6e; --rep:#9686c4;
  --ok:#3d9f8a; --ng:#c48b7f;
  --shadow:0 10px 40px rgba(28,34,48,.08), 0 2px 8px rgba(28,34,48,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0e15; --surface:rgba(20,25,36,.72); --surface-solid:#141924;
    --line:#232b3a; --edge:#3b4558; --text:#e5e8ef; --muted:#8f98aa; --faint:#5d6779;
    --node:#121722; --accent:#8193ff;
    --cog:#7fa2e8; --pos:#c9b085; --rep:#ab9be0;
    --ok:#56c1a8; --ng:#d79c90;
    --shadow:0 10px 40px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  -webkit-font-smoothing:antialiased; line-height:1.6;
}
.wrap{max-width:1320px;margin:0 auto;padding:28px 24px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.kicker{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
h1{font-weight:300;font-size:clamp(20px,2.4vw,28px);letter-spacing:.02em;margin-top:8px}
h1 b{font-weight:600}
.lead{font-size:13px;color:var(--muted);margin-top:6px;max-width:640px}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;align-items:center;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px)}
.seg button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;
  padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface-solid);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg-label{font-size:11px;color:var(--faint);margin:0 4px 0 2px}
.switch{
  display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);
  padding:5px 14px 5px 6px;border-radius:999px;cursor:pointer;font:inherit;font-size:12px;color:var(--muted);
  backdrop-filter:blur(12px);
}
.switch .track{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .3s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface-solid);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .3s}
.switch[aria-checked="true"] .track{background:var(--ok)}
.switch[aria-checked="true"] .track::after{transform:translateX(14px)}
.switch[aria-checked="true"]{color:var(--text)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.canvas{
  position:relative;overflow:hidden;padding:8px;
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);
  background-size:22px 22px;
}
.canvas svg{width:100%;height:auto;display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hint{position:absolute;left:18px;bottom:12px;font-size:11px;color:var(--faint)}

/* svg elements */
.spoke{stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4;transition:stroke .25s,stroke-width .25s,opacity .35s}
.edge.functor{stroke-width:1.8}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke-dasharray:4 7;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-44}}
.hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.elabel{font-size:11px;fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:none;transition:opacity .35s}
.grp{cursor:pointer;outline:none}
.grp:hover .edge,.grp:focus-visible .edge,.grp.on .edge{stroke:var(--accent);stroke-width:2.4}
.grp:hover .elabel,.grp.on .elabel{fill:var(--accent)}
.node circle.body{fill:var(--node);stroke-width:1.5;transition:stroke-width .25s,filter .25s}
.node{transform-box:fill-box;transform-origin:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .35s}
.node:hover,.node:focus-visible,.node.on{transform:scale(1.08)}
.node:hover circle.body,.node:focus-visible circle.body,.node.on circle.body{stroke-width:2.6;filter:drop-shadow(0 6px 14px rgba(84,104,232,.22))}
.node .sym{font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node .lbl{font-size:11.5px;fill:var(--muted);text-anchor:middle;pointer-events:none}
.hub .sym{font-size:15px}
.hub .sub{font-size:11px;fill:var(--muted);text-anchor:middle;pointer-events:none}
.halo{opacity:.10;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.18}}
.dim{opacity:.14 !important}
.fb-label{font-size:11.5px;text-anchor:middle;dominant-baseline:central;pointer-events:none}

/* panel */
.panel{padding:22px;display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:16px}
.panel h2{font-size:17px;font-weight:600;line-height:1.45}
.panel .formula{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.panel dt{font-size:11px;letter-spacing:.06em;color:var(--faint);margin-bottom:4px}
.panel dd{font-size:13px;line-height:1.75}
.panel .sep{border-top:1px solid var(--line);padding-top:14px}
.panel .accent dt{color:var(--accent)}
.legend{display:grid;gap:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:1.5px solid}
.pin-clear{align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:4px 12px;border-radius:999px;cursor:pointer}
.pin-clear:hover{color:var(--text)}

/* tooltip */
#tip{
  position:fixed;z-index:50;max-width:300px;padding:14px 16px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  opacity:0;transform:translateY(6px) scale(.98);pointer-events:none;
  transition:opacity .22s ease,transform .22s cubic-bezier(.2,.8,.2,1);
}
#tip.show{opacity:1;transform:none;pointer-events:auto}
#tip .k{font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
#tip .t{font-size:14px;font-weight:600;margin-top:7px;line-height:1.45}
#tip .s{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);margin-top:4px}
#tip .b{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7}
#tip .x{font-size:11px;color:var(--faint);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">Category Theory × Organization</div>
      <h1><b>組織認知</b>の圏論マップ</h1>
      <p class="lead">個人の実（𝒞_Cog）・立場の型（𝒞_Pos）・組織の名（𝒞_Rep）という3つの圏と、それらをつなぐ関手を一枚のネットワークとして描きます。</p>
    </div>
    <button type="button" class="switch" id="mode" role="switch" aria-checked="false">
      <span class="track"></span><span id="mode-text">立場主義・閉鎖系</span>
    </button>
  </header>

  <div class="controls">
    <div class="seg" id="scenarios" aria-label="具体例"></div>
    <div class="seg" id="structures" aria-label="普遍構造"></div>
  </div>

  <div class="grid">
    <section class="card canvas" aria-label="圏と関手のネットワーク図">
      <div id="graph"></div>
      <div class="hint">ノードや線にカーソルを合わせると説明が出ます ・ クリックで右側に固定</div>
    </section>
    <aside class="card panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script>
const MODEL = {"categories": [{"id": "C_Cog", "symbol": "𝒞_Cog", "name": "個体認知圏 (Cognitive Category)", "abstraction": "ミクロ状態空間：生物学的・心理的個体状態と内面的価値評価", "objects": [{"id": "Cog_Surv", "label": "O₁: 生存可能性状態", "desc": "物理的・社会的・代謝的生存の維持水準（孤立回避・エネルギー節約）"}, {"id": "Cog_Self", "label": "O₂: 自我統一性状態", "desc": "自己同一性・有能感・認知的一貫性が保持された内面状態"}, {"id": "Cog_Cap", "label": "O₃: 実質的能力状態", "desc": "個体が保有する固有の暗黙知・批判的思考力・実務遂行能力（『実』）"}], "morphisms": [{"id": "f_loss", "from": "Cog_Cap", "to": "Cog_Surv", "symbol": "f_loss : O₃ → O₁", "name": "損失回避・負の強化", "desc": "減点や排斥リスクを回避するため、突出した能力行使を抑制し安全領域へ遷移する射"}, {"id": "f_conf", "from": "Cog_Surv", "to": "Cog_Self", "symbol": "f_conf : O₁ → O₂", "name": "確証バイアス・不協和解消", "desc": "生存脅威や不都合な現実を遮断し、自己の正当性と一貫性を防衛する射"}, {"id": "id_cog", "from": "Cog_Self", "to": "Cog_Self", "symbol": "id_Cog : O₂ → O₂", "name": "現状維持バイアス（恒等射）", "desc": "参照点を現在状態に固定し、認知的負荷を最小化する恒等変換"}]}, {"id": "C_Pos", "symbol": "𝒞_Pos", "name": "制度立場圏 (Positional Category)", "abstraction": "メソ状態空間：組織構造から割り当てられた役割規定（型）と手続き遷移", "objects": [{"id": "Pos_Gov", "label": "P₁: 経営統治層の立場", "desc": "全体統制・方針策定を担う制度的役職（現場から空間的に分離された位置）"}, {"id": "Pos_Mid", "label": "P₂: 中間管理層の立場", "desc": "上下の緩衝・領地（予算・人員）保全・手続き管理を担う制度的役職"}, {"id": "Pos_Exe", "label": "P₃: 現場実行層の立場", "desc": "規定プログラムの消化・実行時例外処理（Try-Catch）を担う制度的役職"}], "morphisms": [{"id": "g_proc", "from": "Pos_Gov", "to": "Pos_Mid", "symbol": "g_rule : P₁ → P₂", "name": "規則・目標の演繹的下達", "desc": "抽象化された単一指標や標準手続きを上位から下位へ賦課する制度的射"}, {"id": "g_try", "from": "Pos_Mid", "to": "Pos_Exe", "symbol": "g_try : P₂ → P₃", "name": "手続責任・例外抑制の委譲", "desc": "任期中の無事故・前例踏襲・85〜90%微小未達の維持を要請する制度的射"}, {"id": "id_pos", "from": "Pos_Mid", "to": "Pos_Mid", "symbol": "id_Pos : P₂ → P₂", "name": "前例踏襲（恒等射）", "desc": "思考と結果責任を制度的役割へアウトソーシングし、型を反復維持する恒等変換"}]}, {"id": "C_Rep", "symbol": "𝒞_Rep", "name": "組織表象圏 (Representational Category)", "abstraction": "マクロ状態空間：組織内で公式に流通する記号・定量指標・承認文書（『名』）", "objects": [{"id": "Rep_Doc", "label": "R₁: 公式稟議・報告表象", "desc": "合議制と減点回避フィルタを通過し、政治的に平滑化された公式文書"}, {"id": "Rep_KPI", "label": "R₂: 定量評価・単位表象", "desc": "実態から切り離され自己目的化した測定値（KPI達成率・履修単位・正常終了コード）"}, {"id": "Rep_AI", "label": "R₃: 洗浄済ナレッジ表象", "desc": "生成AI・知識管理システムにより論理的流暢さと客観的権威が付与された表象"}], "morphisms": [{"id": "h_game", "from": "Rep_Doc", "to": "Rep_KPI", "symbol": "h_game : R₁ → R₂", "name": "指標ゲーミング（グッドハート射）", "desc": "実質的価値ではなく測定数値のみを最適化する記号間の変換プロセス"}, {"id": "h_wash", "from": "Rep_KPI", "to": "Rep_AI", "symbol": "F_AI : R₂ → R₃", "name": "事実洗浄（Truth Washing）", "desc": "生成文脈（保身・忖度）を捨象したまま統計的流暢さを付与し、客観的教条へ昇華させる射"}, {"id": "id_rep", "from": "Rep_AI", "to": "Rep_AI", "symbol": "id_Rep : R₃ → R₃", "name": "記号の自己言及的保持（恒等射）", "desc": "物理的現実と接地しないまま表象空間内部で整合性を循環させる恒等変換"}]}], "structures": [{"id": "adjunction", "title": "1. 随伴関手 (L ⊣ U) ：忘却と型への同化", "formula": "Hom_𝒞_Cog(L(P), C) ≅ Hom_𝒞_Pos(P, U(C))", "summary": "忘却関手 U が個人の実質的能力・内面葛藤（実）を捨象して『立場 P』へ射影し、左随伴 L が『立場から期待される標準的な型 L(P)』を内面へ付与する普遍的対応。", "mechanism": "個体が組織内で独自の判断を下すよりも、立場 P が要求する定型役割 L(P) に自己を同化させる方が、認知的代謝コストと減点リスクを同時に最小化できる（普遍性）。"}, {"id": "monad", "title": "2. 立場主義モナド (T = U ∘ L, η, μ) ：型の極限追求", "formula": "η : Id ⇒ T （責任の外部化）,  μ : T² ⇒ T （手続きの自己増殖）", "summary": "随伴から生じる自己関手 T はモナドを形成する。『型を守るための型（手続きのための手続き）』が無限に反復されても T の内部に閉じ込められる。", "mechanism": "クライスリ射 f : X → T(Y) により、すべての業務出力 Y には『立場上の免責条件・予算確保の口実（85〜90%の微小未達）』というモナド的文脈 T が不可分に結合される（パーキンソンの法則）。"}, {"id": "colimit", "title": "3. 余極限 (Colimit) ：合成の誤謬と無責任の体系", "formula": "Colim (P₁ → P₂ → P₃) ⟶ ∅_ Accountability （結果責任の消滅）", "summary": "各階層・各工程（例：学年進行や部門間バトンパス）が『任期中のランタイム例外処理（手続責任）』のみを局所的に可換にした結果、全体の余極限において結果責任が消失する。", "mechanism": "局所図式では『規定手順の履行（Exit Code 0）』が成立しているが、大域的な貼り合わせ（余極限）においては、最終アウトプットの品質保証（SLA）を担う対象が存在しない構造的不整合が生じる。"}, {"id": "pullback", "title": "4. 引き戻し (Pullback) の欠如と回復：AI事実洗浄 vs 動的適応", "formula": "Pullback (𝒞_Cog ×_𝒞_Rep 𝒞_Pos) の喪失と再構築", "summary": "忘却関手によって現場の文脈が失われた表象圏 𝒞_Rep 上で AI 関手 F_AI を作用させると、実態への引き戻し（接地）を欠いたまま虚構が正当化される。", "mechanism": "これを打破するには、知己（メタ認知）・正名（名実の再結合）・無形（固定構造の流動化）・無用の用（余白対象の導入）によって、表象 R から実態 O への引き戻し射（接地検証）を制度的に再構築する必要がある。"}]};

<script>
const NS = 'http://www.w3.org/2000/svg';
let scenario = 'abstract', adapted = false, structure = null, pinned = null;

const CATS = Object.fromEntries(MODEL.categories.map(c => [c.id, c]));
const CAT_INFO = {
  C_Cog: { color: 'var(--cog)', tag: '実', jp: '個体認知' },
  C_Pos: { color: 'var(--pos)', tag: '型', jp: '制度立場' },
  C_Rep: { color: 'var(--rep)', tag: '名', jp: '組織表象' }
};
const HUB = { C_Cog: [210, 320], C_Pos: [540, 300], C_Rep: [870, 320] };
const NODE = {
  Cog_Cap: [110, 165], Cog_Surv: [90, 478], Cog_Self: [290, 505],
  Pos_Gov: [540, 122], Pos_Mid: [455, 490], Pos_Exe: [650, 490],
  Rep_Doc: [968, 165], Rep_KPI: [992, 478], Rep_AI: [775, 505]
};
const R_HUB = 46, R_NODE = 26;
const STRUCT_SHORT = { adjunction: '随伴', monad: 'モナド', colimit: '余極限', pullback: '引き戻し' };
const FOCUS = {
  adjunction: ['hub:C_Cog', 'hub:C_Pos', 'fun:U', 'fun:L'],
  monad: ['hub:C_Pos', 'fun:U', 'fun:L', 'mor:id_pos', 'obj:Pos_Mid'],
  colimit: ['hub:C_Pos', 'obj:Pos_Gov', 'obj:Pos_Mid', 'obj:Pos_Exe', 'mor:g_proc', 'mor:g_try', 'fb'],
  pullback: ['fb', 'hub:C_Rep', 'hub:C_Cog', 'mor:h_wash', 'obj:Rep_AI', 'obj:Cog_Cap']
};
const FUNCTORS = {
  closed: {
    U: { label: 'U', title: '忘却関手 U', sym: 'U : 𝒞_Cog → 𝒞_Pos', body: '個人の能力や内面の葛藤を捨象し、「立場」だけを取り出す。' },
    L: { label: 'L', title: '自由関手 L（L ⊣ U）', sym: 'L : 𝒞_Pos → 𝒞_Cog', body: '立場に期待される標準の「型」を個人の内面へ与える。U と随伴をなす。' },
    F: { label: 'F', title: '表象化関手 F_Metric', sym: 'F : 𝒞_Pos → 𝒞_Rep', body: '立場の活動を単一指標・文書・単位という記号へ写し、流通させる。' },
    fb: { label: '引き戻し 欠如', title: '引き戻し（Pullback）の欠如', sym: '𝒞_Rep ⇢ 𝒞_Cog は不成立', body: '表象から実態へ戻る検証経路がない。余極限で結果責任が消え、AIによる事実洗浄が閉じた循環になる。' }
  },
  adapted: {
    U: { label: 'F_Preserve', title: '文脈保持関手 F_Preserve', sym: '𝒞_Cog → 𝒞_Pos', body: '能力や現場の文脈を捨てずに立場へ対応づける（正名）。' },
    L: { label: '自律保護', title: '自律性保護', sym: '𝒞_Pos → 𝒞_Cog', body: '型を押しつけず、個人の判断余地（無用の用）を残して返す。' },
    F: { label: 'F_Ground', title: '接地関手 F_Ground', sym: '𝒞_Pos → 𝒞_Rep', body: '多面的な評価で、記号と実態が一致するよう表象化する。' },
    fb: { label: '引き戻し 成立', title: '引き戻し（Pullback）の成立', sym: '𝒞_Cog ×_𝒞_Rep 𝒞_Pos', body: '知己・正名・無形・無用の用によって、表象から現場の実態へ再接地する検証経路ができる。' }
  }
};

/* ---------- geometry ---------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const len = a => Math.hypot(a[0], a[1]) || 1;
const unit = a => mul(a, 1 / len(a));
const rot = (v, deg) => { const r = deg * Math.PI / 180; return [v[0] * Math.cos(r) - v[1] * Math.sin(r), v[0] * Math.sin(r) + v[1] * Math.cos(r)]; };
const f = p => p.map(n => n.toFixed(1)).join(' ');

function curve(a, b, ra, rb, bend, away) {
  const m = mul(add(a, b), .5), d = sub(b, a), n = unit([-d[1], d[0]]);
  let c = add(m, mul(n, bend));
  if (away) { const c2 = add(m, mul(n, -bend)); if (len(sub(c2, away)) > len(sub(c, away))) c = c2; }
  const s = add(a, mul(unit(sub(c, a)), ra + 2));
  const e = add(b, mul(unit(sub(c, b)), rb + 5));
  const mid = add(add(mul(s, .25), mul(c, .5)), mul(e, .25));
  return { d: `M ${f(s)} Q ${f(c)} ${f(e)}`, mid };
}
const LOOP_DIR = { Cog_Self: [0.6, -0.8], Pos_Mid: [-1, 0], Rep_AI: [-0.6, -0.8] };
const BEND = { g_proc: 95 };
function loop(p, hub, r, id) {
  const u = LOOP_DIR[id] ? unit(LOOP_DIR[id]) : unit(sub(p, hub));
  const s = add(p, mul(rot(u, 35), r)), e = add(p, mul(rot(u, -35), r + 4));
  const c1 = add(p, mul(rot(u, 55), r + 52)), c2 = add(p, mul(rot(u, -55), r + 52));
  return { d: `M ${f(s)} C ${f(c1)} ${f(c2)} ${f(e)}`, mid: add(p, mul(u, r + 50)) };
}

/* ---------- svg helpers ---------- */
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function wrap(text, n = 10, lines = 2) {
  const out = [];
  for (let i = 0; i < text.length && out.length < lines; i += n) out.push(text.slice(i, i + n));
  if (text.length > n * lines) out[lines - 1] = out[lines - 1].slice(0, n - 1) + '…';
  return out;
}
function interactive(g, key, info) {
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  g.setAttribute('aria-label', info().title);
  g.dataset.key = key;
  g.addEventListener('pointerenter', () => showTip(g, info()));
  g.addEventListener('pointerleave', hideTipSoon);
  g.addEventListener('focus', () => showTip(g, info()));
  g.addEventListener('blur', hideTipSoon);
  const pin = () => { pinned = { key, info }; renderPanel(); markOn(); };
  g.addEventListener('click', pin);
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pin(); } });
}

/* ---------- content ---------- */
const sc = () => SCENARIOS[scenario];
const fn = () => FUNCTORS[adapted ? 'adapted' : 'closed'];
function objInfo(cat, o) {
  const e = sc().objects[o.id], a = SCENARIOS.abstract.objects[o.id];
  return { kicker: `${cat.symbol} ・ 対象`, title: e.title, body: e.example, extra: scenario !== 'abstract' ? `抽象：${a.title}` : '' };
}
function morInfo(cat, m) {
  const e = sc().morphisms[m.id];
  return { kicker: `${cat.symbol} ・ 射`, title: e.name, sym: m.symbol, body: e.example };
}
function hubInfo(cat) {
  return { kicker: '圏', title: cat.name, sym: cat.symbol, body: cat.abstraction };
}
function funInfo(k) { const x = fn()[k]; return { kicker: k === 'fb' ? '普遍構造' : '関手', title: x.title, sym: x.sym, body: x.body }; }

/* ---------- render graph ---------- */
function renderGraph() {
  const box = document.getElementById('graph');
  box.innerHTML = '';
  const svg = el('svg', { viewBox: '0 0 1080 700', role: 'img', 'aria-label': '3つの圏と関手のネットワーク' }, box);
  const defs = el('defs', {}, svg);
  [['ar', 'var(--edge)'], ['ar-ok', 'var(--ok)'], ['ar-ng', 'var(--ng)']].forEach(([id, c]) => {
    const mk = el('marker', { id, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M1 1.5 L8 5 L1 8.5', fill: 'none', stroke: c, 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, mk);
  });
  const lSpokes = el('g', {}, svg), lEdges = el('g', {}, svg), lNodes = el('g', {}, svg);

  // feedback arc (pullback)
  {
    const F = fn().fb, color = adapted ? 'var(--ok)' : 'var(--ng)';
    const g = el('g', { class: 'grp' }, lEdges);
    const d = 'M 870 368 Q 900 660 540 660 Q 180 660 206 370';
    el('path', { d, class: 'hit' }, g);
    el('path', { d, class: 'edge functor ' + (adapted ? 'flow' : 'dashed'), stroke: color, style: `stroke:${color}`, 'marker-end': `url(#${adapted ? 'ar-ok' : 'ar-ng'})` }, g);
    const w = F.label.length * 12 + 28;
    el('rect', { x: 540 - w / 2, y: 646, width: w, height: 28, rx: 14, fill: 'var(--surface-solid)', stroke: color, 'stroke-width': 1 }, g);
    const t = el('text', { x: 540, y: 660, class: 'fb-label', fill: color }, g); t.textContent = F.label;
    interactive(g, 'fb', () => funInfo('fb'));
  }

  // functors between hubs
  const fu = [
    ['U', 'C_Cog', 'C_Pos', -70, false],
    ['L', 'C_Pos', 'C_Cog', -70, true],
    ['F', 'C_Pos', 'C_Rep', -70, false]
  ];
  fu.forEach(([k, a, b, bend, dashed]) => {
    const c = curve(HUB[a], HUB[b], R_HUB, R_HUB, bend);
    const g = el('g', { class: 'grp' }, lEdges);
    el('path', { d: c.d, class: 'hit' }, g);
    el('path', { d: c.d, class: 'edge functor' + (dashed ? ' dashed' : ''), 'marker-end': 'url(#ar)' }, g);
    const t = el('text', { x: c.mid[0], y: c.mid[1] + (k === 'L' ? 16 : -8), class: 'elabel', 'text-anchor': 'middle' }, g);
    t.textContent = fn()[k].label;
    interactive(g, 'fun:' + k, () => funInfo(k));
  });

  // categories
  MODEL.categories.forEach(cat => {
    const ci = CAT_INFO[cat.id], hp = HUB[cat.id];
    const objs = Object.fromEntries(cat.objects.map(o => [o.id, o]));

    cat.objects.forEach(o => {
      const p = NODE[o.id], u = unit(sub(p, hp));
      const s = add(hp, mul(u, R_HUB + 4)), e = sub(p, mul(u, R_NODE + 4));
      el('line', { x1: s[0], y1: s[1], x2: e[0], y2: e[1], class: 'spoke' }, lSpokes);
    });

    cat.morphisms.forEach(m => {
      const g = el('g', { class: 'grp' }, lEdges);
      const c = m.from === m.to ? loop(NODE[m.from], hp, R_NODE, m.from) : curve(NODE[m.from], NODE[m.to], R_NODE, R_NODE, BEND[m.id] || 34, hp);
      el('path', { d: c.d, class: 'hit' }, g);
      el('path', { d: c.d, class: 'edge', 'marker-end': 'url(#ar)' }, g);
      const t = el('text', { x: c.mid[0], y: c.mid[1] + 4, class: 'elabel', 'text-anchor': 'middle' }, g);
      t.textContent = m.symbol.split(':')[0].trim();
      interactive(g, 'mor:' + m.id, () => morInfo(cat, m));
    });

    // hub
    const hg = el('g', { class: 'node hub' }, lNodes);
    el('circle', { cx: hp[0], cy: hp[1], r: R_HUB + 16, fill: ci.color, class: 'halo' }, hg);
    el('circle', { cx: hp[0], cy: hp[1], r: R_HUB, class: 'body', stroke: ci.color }, hg);
    const st = el('text', { x: hp[0], y: hp[1] - 7, class: 'sym', fill: ci.color }, hg); st.textContent = cat.symbol;
    const sb = el('text', { x: hp[0], y: hp[1] + 15, class: 'sub' }, hg); sb.textContent = `${ci.tag} ・ ${ci.jp}`;
    interactive(hg, 'hub:' + cat.id, () => hubInfo(cat));

    // objects
    cat.objects.forEach(o => {
      const p = NODE[o.id];
      const g = el('g', { class: 'node' }, lNodes);
      el('circle', { cx: p[0], cy: p[1], r: R_NODE, class: 'body', stroke: ci.color }, g);
      const sym = el('text', { x: p[0], y: p[1], class: 'sym', fill: ci.color }, g);
      sym.textContent = o.label.split(':')[0].trim();
      const title = sc().objects[o.id].title;
      const name = title.includes(':') ? title.split(':').slice(1).join(':').trim() : title;
      const below = p[1] > hp[1];
      wrap(name).forEach((line, i, arr) => {
        const y = below ? p[1] + R_NODE + 17 + i * 15 : p[1] - R_NODE - 10 - (arr.length - 1 - i) * 15;
        const t = el('text', { x: p[0], y, class: 'lbl' }, g); t.textContent = line;
      });
      interactive(g, 'obj:' + o.id, () => objInfo(cat, o));
    });
  });

  applyFocus();
  markOn();
}

function applyFocus() {
  const set = structure ? new Set(FOCUS[structure]) : null;
  document.querySelectorAll('#graph [data-key]').forEach(n => n.classList.toggle('dim', !!set && !set.has(n.dataset.key)));
  document.querySelectorAll('#graph .spoke').forEach(n => n.classList.toggle('dim', !!set));
}
function markOn() {
  document.querySelectorAll('#graph [data-key]').forEach(n => n.classList.toggle('on', !!pinned && pinned.key === n.dataset.key));
}

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
let hideTimer = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function showTip(target, info) {
  clearTimeout(hideTimer);
  tip.innerHTML = `<div class="k">${esc(info.kicker)}</div><div class="t">${esc(info.title)}</div>`
    + (info.sym ? `<div class="s">${esc(info.sym)}</div>` : '')
    + `<div class="b">${esc(info.body)}</div>`
    + (info.extra ? `<div class="x">${esc(info.extra)}</div>` : '');
  const r = target.getBoundingClientRect();
  tip.classList.add('show');
  const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 12;
  let left = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), innerWidth - tw - 8);
  let top = r.top - th - gap;
  if (top < 8) top = r.bottom + gap;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTipSoon() { clearTimeout(hideTimer); hideTimer = setTimeout(() => tip.classList.remove('show'), 160); }
tip.addEventListener('pointerenter', () => clearTimeout(hideTimer));
tip.addEventListener('pointerleave', hideTipSoon);
document.addEventListener('keydown', e => { if (e.key === 'Escape') tip.classList.remove('show'); });
addEventListener('scroll', () => tip.classList.remove('show'), { passive: true });

/* ---------- panel ---------- */
function renderPanel() {
  const p = document.getElementById('panel');
  const s = sc();
  let html = `<div><div class="kicker">${esc(s.badge)}</div><p style="font-size:12.5px;color:var(--muted);margin-top:8px">${esc(s.desc)}</p></div>`;
  if (pinned) {
    const i = pinned.info();
    html += `<div class="sep"><div class="kicker">${esc(i.kicker)}</div><h2 style="margin-top:8px">${esc(i.title)}</h2></div>`
      + (i.sym ? `<div class="formula">${esc(i.sym)}</div>` : '')
      + `<dl><dt>説明</dt><dd>${esc(i.body)}</dd></dl>`
      + (i.extra ? `<dl><dt>抽象との対応</dt><dd>${esc(i.extra.replace('抽象：', ''))}</dd></dl>` : '')
      + `<button type="button" class="pin-clear" onclick="pinned=null;renderPanel();markOn()">固定を解除</button>`;
  } else if (structure) {
    const st = MODEL.structures.find(x => x.id === structure);
    const ex = STRUCT_EX[scenario] && STRUCT_EX[scenario][structure];
    html += `<div class="sep"><div class="kicker">普遍構造</div><h2 style="margin-top:8px">${esc(st.title)}</h2></div>`
      + `<div class="formula">${esc(st.formula)}</div>`
      + `<dl><dt>圏論的な意味</dt><dd>${esc(st.summary)}</dd></dl>`
      + `<dl><dt>組織での現れ方</dt><dd>${esc(st.mechanism)}</dd></dl>`
      + (ex ? `<dl class="sep accent"><dt>具体例 ・ ${esc(s.label)}</dt><dd>${esc(ex)}</dd></dl>` : '');
  } else {
    html += `<div class="sep"><h2>使い方</h2><p style="font-size:13px;color:var(--muted);margin-top:6px">ノードや線にカーソルを合わせると短い説明が出ます。クリックするとここに固定されます。上部の構造ボタンで、関係する部分だけを強調できます。</p></div>`
      + `<div class="legend">`
      + MODEL.categories.map(c => `<div><span style="border-color:${CAT_INFO[c.id].color}"></span>${esc(c.symbol)} ${esc(CAT_INFO[c.id].tag)} ・ ${esc(CAT_INFO[c.id].jp)}</div>`).join('')
      + `<div style="margin-top:4px">大きな円 = 圏 ／ 小さな円 = 対象 ／ 矢印 = 射・関手</div></div>`;
  }
  p.innerHTML = html;
}

/* ---------- controls ---------- */
function renderControls() {
  document.getElementById('scenarios').innerHTML = '<span class="seg-label">具体例</span>' + Object.entries(SCENARIOS).map(([k, v]) =>
    `<button type="button" aria-pressed="${k === scenario}" data-sc="${k}">${esc(v.label.replace(/^[①-⑳]\s*/, ''))}</button>`).join('');
  document.getElementById('structures').innerHTML = '<span class="seg-label">構造</span>'
    + `<button type="button" aria-pressed="${!structure}" data-st="">全体</button>`
    + MODEL.structures.map(s => `<button type="button" aria-pressed="${s.id === structure}" data-st="${s.id}">${STRUCT_SHORT[s.id]}</button>`).join('');
}
document.getElementById('scenarios').addEventListener('click', e => {
  const b = e.target.closest('button[data-sc]'); if (!b) return;
  scenario = b.dataset.sc; renderAll();
});
document.getElementById('structures').addEventListener('click', e => {
  const b = e.target.closest('button[data-st]'); if (!b) return;
  structure = b.dataset.st || null; pinned = null;
  renderControls(); applyFocus(); markOn(); renderPanel();
});
document.getElementById('mode').addEventListener('click', function () {
  adapted = !adapted;
  this.setAttribute('aria-checked', adapted);
  document.getElementById('mode-text').textContent = adapted ? '動的適応・引き戻し' : '立場主義・閉鎖系';
  renderGraph(); renderPanel();
});

function renderAll() { renderControls(); renderGraph(); renderPanel(); }
renderAll();

</script>
</body>
</html>
