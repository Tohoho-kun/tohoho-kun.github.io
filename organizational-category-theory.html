<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>組織構造と認知バイアスの圏論的統合モデル</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root{
      --background:#eef2ff; --foreground:#1e1b4b;
      --card:#ffffff; --border:#c7d2fe;
      --muted-foreground:#5b6490;
      --primary:#4f46e5; --primary-foreground:#ffffff;
      --secondary:#e0e7ff; --secondary-foreground:#3730a3;
      --c-cog:#2563eb; --c-pos:#d97706; --c-rep:#9333ea;
      --c-cog-bg:#dbeafe; --c-pos-bg:#fef3c7; --c-rep-bg:#f3e8ff;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --background:#0f1030; --foreground:#e8eaff;
        --card:#1a1c47; --border:#3a3f8f;
        --muted-foreground:#a5acd9;
        --primary:#818cf8; --primary-foreground:#0f1030;
        --secondary:#2a2e6b; --secondary-foreground:#c7d2fe;
        --c-cog:#60a5fa; --c-pos:#fbbf24; --c-rep:#c084fc;
        --c-cog-bg:#172554; --c-pos-bg:#422006; --c-rep-bg:#3b0764;
      }
    }
    body{
      background:
        radial-gradient(900px 400px at 10% -10%, rgba(99,102,241,.25), transparent 60%),
        radial-gradient(800px 400px at 90% 0%, rgba(236,72,153,.18), transparent 60%),
        var(--background) !important;
    }
    header h1{
      background:linear-gradient(90deg,var(--c-cog),var(--c-rep),#ec4899);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    header > div:first-child{ border-left:4px solid var(--primary); padding-left:12px; }
    #scenario-bar{ background:linear-gradient(135deg,var(--card),var(--secondary)) !important; }
    #structure-banner,#inspector-panel{ border-top:4px solid var(--primary) !important; box-shadow:0 4px 16px rgba(79,70,229,.12) !important; }
    #categories-grid > article{ border-top-width:4px !important; border-top-style:solid; }
    #categories-grid > article:nth-child(1){ border-top-color:var(--c-cog); background:linear-gradient(180deg,var(--c-cog-bg),var(--card) 90px) !important; }
    #categories-grid > article:nth-child(2){ border-top-color:var(--c-pos); background:linear-gradient(180deg,var(--c-pos-bg),var(--card) 90px) !important; }
    #categories-grid > article:nth-child(3){ border-top-color:var(--c-rep); background:linear-gradient(180deg,var(--c-rep-bg),var(--card) 90px) !important; }
    #categories-grid > article:nth-child(1) h3, #categories-grid > article:nth-child(1) .font-mono{ color:var(--c-cog); }
    #categories-grid > article:nth-child(2) h3, #categories-grid > article:nth-child(2) .font-mono{ color:var(--c-pos); }
    #categories-grid > article:nth-child(3) h3, #categories-grid > article:nth-child(3) .font-mono{ color:var(--c-rep); }
    #categories-grid > article:nth-child(1) .node-btn{ border-left:3px solid var(--c-cog); }
    #categories-grid > article:nth-child(2) .node-btn{ border-left:3px solid var(--c-pos); }
    #categories-grid > article:nth-child(3) .node-btn{ border-left:3px solid var(--c-rep); }
    .node-btn{ transition:all .2s cubic-bezier(.4,0,.2,1); background:var(--card) !important; }
    .node-btn:hover{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(79,70,229,.2); }
    .active-ring{ outline:2px solid var(--primary); outline-offset:2px; }
    button[aria-pressed="true"],button[aria-selected="true"]{ background:linear-gradient(135deg,#4f46e5,#9333ea) !important; color:#fff !important; border-color:transparent !important; }
    #toggle-adaptation{ background:linear-gradient(135deg,#f59e0b,#ef4444) !important; color:#fff !important; border-color:transparent !important; }
    .diagram-arrow{ stroke-dasharray:6 4; animation:flow 1.6s linear infinite; }
    @keyframes flow{ to{ stroke-dashoffset:-20; } }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen p-4 md:p-6">
  <header class="max-w-7xl mx-auto mb-6 border-b border-[var(--border)] pb-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div>
        <p class="text-xs font-mono uppercase tracking-wider text-[var(--muted-foreground)]">Category Theory × Organizational Pathology</p>
        <h1 class="text-xl md:text-2xl font-bold mt-1">人間認知・立場主義・組織表象の圏論的構造化シミュレータ</h1>
      </div>
      <div class="flex flex-wrap gap-2" id="mode-tabs" role="tablist" aria-label="圏論構造モード切替"></div>
    </div>
    <p class="text-sm text-[var(--muted-foreground)] mt-2">
      3つの圏（個体認知圏 𝒞_Cog・制度立場圏 𝒞_Pos・組織表象圏 𝒞_Rep）の対象・射・関手・モナド・余極限を同一の抽象度（状態空間と状態遷移）で可視化します。各要素をクリックすると圏論的定義と組織力学の対応を検査できます。
    </p>
    <div id="scenario-bar" class="mt-3 p-3 rounded-xl border border-[var(--border)] bg-[var(--card)]"></div>
  </header>

  <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Left / Center: Interactive Commutative Diagram & 3 Categories -->
    <section class="lg:col-span-8 space-y-6" aria-label="圏と関手の可換図式">
      <!-- Active Structure Banner -->
      <div id="structure-banner" class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm"></div>

      <!-- Interactive SVG Functor & Commutative Diagram Canvas -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-semibold">関手・自然変換・可換図式ビジュアライザ</h2>
          <div class="flex items-center gap-2">
            <button type="button" id="toggle-adaptation" class="text-xs px-3 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium hover:opacity-90">
              現在：立場主義・閉鎖モード（クリックで動的適応・引き戻しモードへ切替）
            </button>
          </div>
        </div>
        <div id="svg-container" class="w-full overflow-x-auto"></div>
      </div>

      <!-- 3 Categories Parallel Matrix -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="categories-grid"></div>
    </section>

    <!-- Right: Detailed Mathematical & Organizational Inspector -->
    <aside class="lg:col-span-4 space-y-4" aria-label="詳細インスペクタ">
      <div id="inspector-panel" class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm sticky top-4"></div>
    </aside>
  </main>

  <script>
    const MODEL = {"categories": [{"id": "C_Cog", "symbol": "𝒞_Cog", "name": "個体認知圏 (Cognitive Category)", "abstraction": "ミクロ状態空間：生物学的・心理的個体状態と内面的価値評価", "objects": [{"id": "Cog_Surv", "label": "O₁: 生存可能性状態", "desc": "物理的・社会的・代謝的生存の維持水準（孤立回避・エネルギー節約）"}, {"id": "Cog_Self", "label": "O₂: 自我統一性状態", "desc": "自己同一性・有能感・認知的一貫性が保持された内面状態"}, {"id": "Cog_Cap", "label": "O₃: 実質的能力状態", "desc": "個体が保有する固有の暗黙知・批判的思考力・実務遂行能力（『実』）"}], "morphisms": [{"id": "f_loss", "from": "Cog_Cap", "to": "Cog_Surv", "symbol": "f_loss : O₃ → O₁", "name": "損失回避・負の強化", "desc": "減点や排斥リスクを回避するため、突出した能力行使を抑制し安全領域へ遷移する射"}, {"id": "f_conf", "from": "Cog_Surv", "to": "Cog_Self", "symbol": "f_conf : O₁ → O₂", "name": "確証バイアス・不協和解消", "desc": "生存脅威や不都合な現実を遮断し、自己の正当性と一貫性を防衛する射"}, {"id": "id_cog", "from": "Cog_Self", "to": "Cog_Self", "symbol": "id_Cog : O₂ → O₂", "name": "現状維持バイアス（恒等射）", "desc": "参照点を現在状態に固定し、認知的負荷を最小化する恒等変換"}]}, {"id": "C_Pos", "symbol": "𝒞_Pos", "name": "制度立場圏 (Positional Category)", "abstraction": "メソ状態空間：組織構造から割り当てられた役割規定（型）と手続き遷移", "objects": [{"id": "Pos_Gov", "label": "P₁: 経営統治層の立場", "desc": "全体統制・方針策定を担う制度的役職（現場から空間的に分離された位置）"}, {"id": "Pos_Mid", "label": "P₂: 中間管理層の立場", "desc": "上下の緩衝・領地（予算・人員）保全・手続き管理を担う制度的役職"}, {"id": "Pos_Exe", "label": "P₃: 現場実行層の立場", "desc": "規定プログラムの消化・実行時例外処理（Try-Catch）を担う制度的役職"}], "morphisms": [{"id": "g_proc", "from": "Pos_Gov", "to": "Pos_Mid", "symbol": "g_rule : P₁ → P₂", "name": "規則・目標の演繹的下達", "desc": "抽象化された単一指標や標準手続きを上位から下位へ賦課する制度的射"}, {"id": "g_try", "from": "Pos_Mid", "to": "Pos_Exe", "symbol": "g_try : P₂ → P₃", "name": "手続責任・例外抑制の委譲", "desc": "任期中の無事故・前例踏襲・85〜90%微小未達の維持を要請する制度的射"}, {"id": "id_pos", "from": "Pos_Mid", "to": "Pos_Mid", "symbol": "id_Pos : P₂ → P₂", "name": "前例踏襲（恒等射）", "desc": "思考と結果責任を制度的役割へアウトソーシングし、型を反復維持する恒等変換"}]}, {"id": "C_Rep", "symbol": "𝒞_Rep", "name": "組織表象圏 (Representational Category)", "abstraction": "マクロ状態空間：組織内で公式に流通する記号・定量指標・承認文書（『名』）", "objects": [{"id": "Rep_Doc", "label": "R₁: 公式稟議・報告表象", "desc": "合議制と減点回避フィルタを通過し、政治的に平滑化された公式文書"}, {"id": "Rep_KPI", "label": "R₂: 定量評価・単位表象", "desc": "実態から切り離され自己目的化した測定値（KPI達成率・履修単位・正常終了コード）"}, {"id": "Rep_AI", "label": "R₃: 洗浄済ナレッジ表象", "desc": "生成AI・知識管理システムにより論理的流暢さと客観的権威が付与された表象"}], "morphisms": [{"id": "h_game", "from": "Rep_Doc", "to": "Rep_KPI", "symbol": "h_game : R₁ → R₂", "name": "指標ゲーミング（グッドハート射）", "desc": "実質的価値ではなく測定数値のみを最適化する記号間の変換プロセス"}, {"id": "h_wash", "from": "Rep_KPI", "to": "Rep_AI", "symbol": "F_AI : R₂ → R₃", "name": "事実洗浄（Truth Washing）", "desc": "生成文脈（保身・忖度）を捨象したまま統計的流暢さを付与し、客観的教条へ昇華させる射"}, {"id": "id_rep", "from": "Rep_AI", "to": "Rep_AI", "symbol": "id_Rep : R₃ → R₃", "name": "記号の自己言及的保持（恒等射）", "desc": "物理的現実と接地しないまま表象空間内部で整合性を循環させる恒等変換"}]}], "structures": [{"id": "adjunction", "title": "1. 随伴関手 (L ⊣ U) ：忘却と型への同化", "formula": "Hom_𝒞_Cog(L(P), C) ≅ Hom_𝒞_Pos(P, U(C))", "summary": "忘却関手 U が個人の実質的能力・内面葛藤（実）を捨象して『立場 P』へ射影し、左随伴 L が『立場から期待される標準的な型 L(P)』を内面へ付与する普遍的対応。", "mechanism": "個体が組織内で独自の判断を下すよりも、立場 P が要求する定型役割 L(P) に自己を同化させる方が、認知的代謝コストと減点リスクを同時に最小化できる（普遍性）。"}, {"id": "monad", "title": "2. 立場主義モナド (T = U ∘ L, η, μ) ：型の極限追求", "formula": "η : Id ⇒ T （責任の外部化）,  μ : T² ⇒ T （手続きの自己増殖）", "summary": "随伴から生じる自己関手 T はモナドを形成する。『型を守るための型（手続きのための手続き）』が無限に反復されても T の内部に閉じ込められる。", "mechanism": "クライスリ射 f : X → T(Y) により、すべての業務出力 Y には『立場上の免責条件・予算確保の口実（85〜90%の微小未達）』というモナド的文脈 T が不可分に結合される（パーキンソンの法則）。"}, {"id": "colimit", "title": "3. 余極限 (Colimit) ：合成の誤謬と無責任の体系", "formula": "Colim (P₁ → P₂ → P₃) ⟶ ∅_ Accountability （結果責任の消滅）", "summary": "各階層・各工程（例：学年進行や部門間バトンパス）が『任期中のランタイム例外処理（手続責任）』のみを局所的に可換にした結果、全体の余極限において結果責任が消失する。", "mechanism": "局所図式では『規定手順の履行（Exit Code 0）』が成立しているが、大域的な貼り合わせ（余極限）においては、最終アウトプットの品質保証（SLA）を担う対象が存在しない構造的不整合が生じる。"}, {"id": "pullback", "title": "4. 引き戻し (Pullback) の欠如と回復：AI事実洗浄 vs 動的適応", "formula": "Pullback (𝒞_Cog ×_𝒞_Rep 𝒞_Pos) の喪失と再構築", "summary": "忘却関手によって現場の文脈が失われた表象圏 𝒞_Rep 上で AI 関手 F_AI を作用させると、実態への引き戻し（接地）を欠いたまま虚構が正当化される。", "mechanism": "これを打破するには、知己（メタ認知）・正名（名実の再結合）・無形（固定構造の流動化）・無用の用（余白対象の導入）によって、表象 R から実態 O への引き戻し射（接地検証）を制度的に再構築する必要がある。"}]};
    let currentStructureIdx = 0;
    let isAdaptedMode = false;
    let selectedItem = { type: 'structure', data: MODEL.structures[0] };

    function renderTabs() {
      const container = document.getElementById('mode-tabs');
      container.innerHTML = MODEL.structures.map((s, idx) => `
        <button type="button" role="tab" aria-selected="${idx === currentStructureIdx}"
          onclick="selectStructure(${idx})"
          class="text-xs px-3 py-1.5 rounded-lg border border-[var(--border)] font-medium transition ${
            idx === currentStructureIdx
              ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm'
              : 'bg-[var(--card)] text-[var(--foreground)] hover:opacity-80'
          }">
          ${s.title.split('：')[0]}
        </button>
      `).join('');
    }

    function renderBanner() {
      const s = MODEL.structures[currentStructureIdx];
      document.getElementById('structure-banner').innerHTML = `
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 border-b border-[var(--border)] pb-3 mb-3">
          <h2 class="text-base font-bold">${s.title}</h2>
          <code class="text-xs font-mono px-2.5 py-1 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)]">${s.formula}</code>
        </div>
        <p class="text-sm mb-2">${s.summary}</p>
        <p class="text-xs text-[var(--muted-foreground)]"><strong>構造的メカニズム：</strong>${s.mechanism}</p>
      `;
    }

    function renderDiagram() {
      const svgBox = document.getElementById('svg-container');
      const modeColor = isAdaptedMode ? '#10b981' : '#f59e0b';
      const functorLabel1 = isAdaptedMode
        ? '正名・文脈保持関手 F_Preserve (実態と立場の整合)'
        : '立場化・忘却関手 U : 𝒞_Cog → 𝒞_Pos (内面・実力の捨象)';
      const functorLabel2 = isAdaptedMode
        ? '多面評価・接地関手 F_Ground (名実の一致)'
        : '表象化・指標関手 F_Metric : 𝒞_Pos → 𝒞_Rep (単一KPI・単位化)';
      const bottomFeedback = isAdaptedMode
        ? '引き戻し (Pullback) 成立：知己・正名・無形・無用の用による現場実態 (𝒞_Cog) への再接地と修得主義SLA保証'
        : '引き戻し (Pullback) 欠如：余極限 (Colimit) における結果責任の消失（無責任の体系）と AI 事実洗浄 (F_AI) の閉鎖循環';

      svgBox.innerHTML = `
        <svg viewBox="0 0 860 280" class="w-full h-auto select-none" role="img" aria-label="3つの圏と関手の可換図式">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="currentColor" />
            </marker>
          </defs>

          <!-- Category Boxes -->
          <rect x="20" y="25" width="220" height="175" rx="12" fill="var(--c-cog-bg)" stroke="var(--c-cog)" stroke-width="2" />
          <text x="130" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">個体認知圏 𝒞_Cog (実)</text>
          <text x="130" y="68" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">O₁: 生存可能性 / O₂: 自我統一</text>
          <text x="130" y="88" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">O₃: 実質的能力・内面状態</text>
          <rect x="45" y="108" width="170" height="36" rx="6" fill="var(--c-cog)" fill-opacity="0.18" />
          <text x="130" y="130" text-anchor="middle" font-size="12" font-family="monospace" fill="currentColor">f : 損失回避・確証バイアス</text>
          <text x="130" y="175" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">恒等射 id_Cog : 現状維持</text>

          <rect x="320" y="25" width="220" height="175" rx="12" fill="var(--c-pos-bg)" stroke="var(--c-pos)" stroke-width="2" />
          <text x="430" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">制度立場圏 𝒞_Pos (型)</text>
          <text x="430" y="68" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">P₁: 統治 / P₂: 中間 / P₃: 現場</text>
          <text x="430" y="88" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">モナド T = U∘L (役割の自己目的化)</text>
          <rect x="345" y="108" width="170" height="36" rx="6" fill="var(--c-pos)" fill-opacity="0.18" />
          <text x="430" y="130" text-anchor="middle" font-size="12" font-family="monospace" fill="currentColor">g : 手続履行・85-90%未達</text>
          <text x="430" y="175" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">恒等射 id_Pos : 前例踏襲</text>

          <rect x="620" y="25" width="220" height="175" rx="12" fill="var(--c-rep-bg)" stroke="var(--c-rep)" stroke-width="2" />
          <text x="730" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">組織表象圏 𝒞_Rep (名)</text>
          <text x="730" y="68" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">R₁: 稟議 / R₂: 単位・KPI</text>
          <text x="730" y="88" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.75">R₃: AI洗浄済ナレッジ表象</text>
          <rect x="645" y="108" width="170" height="36" rx="6" fill="var(--c-rep)" fill-opacity="0.18" />
          <text x="730" y="130" text-anchor="middle" font-size="12" font-family="monospace" fill="currentColor">h : 指標ハック・事実洗浄 F_AI</text>
          <text x="730" y="175" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">恒等射 id_Rep : 自己言及</text>

          <!-- Functor Arrows -->
          <line x1="242" y1="95" x2="315" y2="95" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)" />
          <text x="278" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor">${isAdaptedMode ? 'F_Preserve' : '忘却 U'}</text>

          <line x1="315" y1="135" x2="242" y2="135" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />
          <text x="278" y="153" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.8">${isAdaptedMode ? '自律性保護' : '自由生成 L'}</text>

          <line x1="542" y1="112" x2="615" y2="112" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)" />
